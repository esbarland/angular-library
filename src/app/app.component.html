<mat-toolbar class="app-toolbar">
  <button mat-icon-button routerLink="/books" aria-label="Accueil">
    <mat-icon>local_library</mat-icon>
  </button>
  <span class="app-title" routerLink="/books">Book Library</span>
  <span class="spacer"></span>
  <span class="book-count">{{ 'app.count' | transloco:{ count: bookService.count() } }}</span>
  <button mat-button (click)="toggleLang()" [matTooltip]="'app.lang_toggle' | transloco">
    {{ 'app.lang_toggle' | transloco }}
  </button>
  <button
    mat-icon-button
    (click)="toggleTheme()"
    [matTooltip]="(isDark() ? 'app.light_mode' : 'app.dark_mode') | transloco"
  >
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<router-outlet />
