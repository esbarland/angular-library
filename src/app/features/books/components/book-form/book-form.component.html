<div class="page-container">
  <div class="page-header">
    <button mat-icon-button routerLink="/books" aria-label="Retour">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="page-title">
      {{ (isEdit() ? 'form.edit_title' : 'form.add_title') | transloco }}
    </h1>
  </div>

  <mat-card appearance="outlined" class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <formly-form
          [form]="form"
          [fields]="fields()"
          [model]="model"
          [options]="options"
        />

        <div class="section-sep"></div>

        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/books">
            <mat-icon>cancel</mat-icon>
            {{ 'form.cancel' | transloco }}
          </button>
          <button mat-flat-button type="submit" [disabled]="form.invalid">
            <mat-icon>{{ isEdit() ? 'save' : 'add' }}</mat-icon>
            {{ (isEdit() ? 'form.save' : 'form.add_submit') | transloco }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
